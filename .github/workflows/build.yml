name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: testdata/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Install fixture tools
        run: make -C testdata init
      # make test regenerates the testdata module (proto -> ent -> conv ->
      # crud) and then verifies every module, so it must come before the
      # dependency check: testdata/go.mod tracks the generated code.
      - name: Test
        run: make test
      - name: Check dependencies
        run: make tidy-check
      - name: Build
        run: make build
